name: Stage verified Windows packages in v0.4.10 draft

on:
  push:
    branches: ["ci/stage-windows-assets-v0.4.10"]

permissions:
  actions: read
  contents: write

jobs:
  windows-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: yungor-ai/yungor-keydock-connect
      SHA: a5cbd8fe968aaebfa37b6d4daf26c4bb9fe4af4d
      DRAFT: "460132911"
    steps:
      - name: Check source run and draft
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/45934477603" | jq -e --arg sha "$SHA" '.head_sha==$sha and .conclusion=="success" and .head_repository.full_name=="yungor-ai/yungor-keydock-connect"'
          gh api "repos/$REPO/actions/runs/45934477603/artifacts" | jq -e 'any(.artifacts[]; .id==15170237832 and .name=="KeyDockConnect-windows-x64" and .expired==false)'
          gh api "repos/$REPO/releases/$DRAFT" | jq -e --arg sha "$SHA" '.id==460132911 and .tag_name=="v0.4.10" and .draft and .target_commitish==$sha'
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          repository: yungor-ai/yungor-keydock-connect
          run-id: 45934477603
          github-token: ${{ github.token }}
          name: KeyDockConnect-windows-x64
          path: verified
      - name: Verify both packages and stage only the two Windows draft assets
        working-directory: verified
        run: |
          set -euo pipefail
          installer='KeyDockConnect-Setup-windows-x64.exe'
          portable='KeyDockConnect-windows-x64.zip'
          exe_sha='7c70bd6b6a50239c5f9ef73ce126d62f24057003e2993ddc0ad2390ae6b59aff'
          zip_sha='e84b70a4e2984dd25611d91481ea57446235b775c4ceb4782218d6d35c688e11'
          printf '%s  %s\n' "$exe_sha" "$installer" "$zip_sha" "$portable" > "$RUNNER_TEMP/expected.txt"
          sha256sum -c "$RUNNER_TEMP/expected.txt"
          cmp "$RUNNER_TEMP/expected.txt" <(tr -d '\r' < SHA256SUMS.txt)
          stage() {
            local name="$1" expected="sha256:$2" starter_id="$3" type="$4" size asset
            size=$(stat -c %s -- "$name")
            gh api "repos/$REPO/releases/$DRAFT" | jq -e --arg sha "$SHA" '.id==460132911 and .tag_name=="v0.4.10" and .draft and .target_commitish==$sha'
            asset=$(gh api "repos/$REPO/releases/$DRAFT/assets" | jq -ec --arg name "$name" '[.[]|select(.name==$name)] | if length<=1 then (.[0] // {}) else error("duplicate asset") end')
            if jq -e --arg digest "$expected" --argjson size "$size" '.state=="uploaded" and .digest==$digest and .size==$size' <<< "$asset" >/dev/null; then
              echo "$name already verified in draft"
              return
            fi
            if ! jq -e 'length==0' <<< "$asset" >/dev/null; then
              jq -e --argjson id "$starter_id" '.id==$id and .state=="starter" and (.digest==null or .digest=="")' <<< "$asset"
              gh api -X DELETE "repos/$REPO/releases/assets/$starter_id"
            fi
            curl -fsS --max-time 120 -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: $type" \
              --data-binary "@$name" "https://uploads.github.com/repos/$REPO/releases/$DRAFT/assets?name=$name" | \
              jq -e --arg name "$name" --arg digest "$expected" --argjson size "$size" \
                'if .state=="uploaded" and .name==$name and .digest==$digest and .size==$size then {id,name,size,digest} else error("unexpected upload response") end'
          }
          stage "$installer" "$exe_sha" 798815169 application/octet-stream
          stage "$portable" "$zip_sha" 798815166 application/zip
