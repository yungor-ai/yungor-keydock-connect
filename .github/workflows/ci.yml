name: Verify native TUN on Windows Server 2022

on:
  push:
    branches: ["ci/windows-2022-tun-a5cbd8f"]

permissions:
  contents: read

jobs:
  windows-tun:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a5cbd8fe968aaebfa37b6d4daf26c4bb9fe4af4d
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - name: Verify source and Windows version
        run: |
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -ne 'a5cbd8fe968aaebfa37b6d4daf26c4bb9fe4af4d') { throw "Unexpected source commit" }
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Output "Source $commit; OS $($os.Caption) $($os.Version), build $($os.BuildNumber)"
      - name: Prepare verified proxy core and offline routing data
        run: python scripts/package-core.py dist/app
      - name: Verify Windows TUN failure handling, routing, IPv4 traffic and recovery
        env:
          KEYDOCK_WINDOWS_TUN_E2E: "1"
        run: |
          $env:KEYDOCK_TEST_CORE = (Resolve-Path "dist/app/core/mihomo.exe").Path
          go test -count=1 -v -ldflags="-H=windowsgui" -run '^TestWindowsTUN(RoutesAndWinINetRestore|CoreStartupFailure)$' ./internal/proxy
