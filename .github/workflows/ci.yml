name: Stage verified Windows packages in v0.4.11 draft

on:
  push:
    branches: ["ci/stage-windows-assets-v0.4.11"]

permissions:
  actions: read
  contents: write

jobs:
  windows-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: yungor-ai/yungor-keydock-connect
      SHA: 02e539db8de37472e3086e0a647456a4613ea0b3
      DRAFT: "460156683"
    steps:
      - name: Check source run and draft
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/45937330255" | jq -e --arg sha "$SHA" '.head_sha==$sha and .conclusion=="success" and .head_repository.full_name=="yungor-ai/yungor-keydock-connect"'
          gh api "repos/$REPO/actions/runs/45937330255/artifacts" | jq -e 'any(.artifacts[]; .id==15170772912 and .digest=="sha256:09e1950ba01d623bf4b581db57b845a73bf6fed0219d8b420683f86bb9e085f4" and .name=="KeyDockConnect-windows-x64" and .expired==false)'
          gh api "repos/$REPO/releases/$DRAFT" | jq -e --arg sha "$SHA" --argjson draft "$DRAFT" '.id==$draft and .tag_name=="v0.4.11" and .draft and .target_commitish==$sha'
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          repository: yungor-ai/yungor-keydock-connect
          run-id: 45937330255
          github-token: ${{ github.token }}
          name: KeyDockConnect-windows-x64
          path: verified
      - name: Verify both packages and stage only the two Windows draft assets
        working-directory: verified
        run: |
          set -euo pipefail
          installer='KeyDockConnect-Setup-windows-x64.exe'
          portable='KeyDockConnect-windows-x64.zip'
          exe_sha='33d323a2a1ddd2b48579453c18a26581c0e352d147e88a6de5d25c98c74b22e5'
          zip_sha='08fdc0fc1da7a77b048238697966edc26001a62920639dc96ad4d7b443152625'
          printf '%s  %s\n' "$exe_sha" "$installer" "$zip_sha" "$portable" > "$RUNNER_TEMP/expected.txt"
          sha256sum -c "$RUNNER_TEMP/expected.txt"
          cmp "$RUNNER_TEMP/expected.txt" <(tr -d '\r' < SHA256SUMS.txt)
          stage() {
            local name="$1" expected="sha256:$2" size="$3" type="$4" asset
            test "$(stat -c %s -- "$name")" = "$size"
            gh api "repos/$REPO/releases/$DRAFT" | jq -e --arg sha "$SHA" --argjson draft "$DRAFT" '.id==$draft and .tag_name=="v0.4.11" and .draft and .target_commitish==$sha'
            asset=$(gh api "repos/$REPO/releases/$DRAFT/assets" | jq -ec --arg name "$name" '[.[]|select(.name==$name)] | if length<=1 then (.[0] // {}) else error("duplicate asset") end')
            if jq -e --arg digest "$expected" --argjson size "$size" '.state=="uploaded" and .digest==$digest and .size==$size' <<< "$asset" >/dev/null; then
              echo "$name already verified in draft"
              return
            fi
            jq -e 'if length==0 then true else error("existing asset differs; manual reconciliation required") end' <<< "$asset" >/dev/null
            curl -fsS --max-time 120 -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: $type" \
              --data-binary "@$name" "https://uploads.github.com/repos/$REPO/releases/$DRAFT/assets?name=$name" | \
              jq -e --arg name "$name" --arg digest "$expected" --argjson size "$size" \
                'if .state=="uploaded" and .name==$name and .digest==$digest and .size==$size then {id,name,size,digest} else error("unexpected upload response") end'
          }
          stage "$installer" "$exe_sha" 25097178 application/octet-stream
          stage "$portable" "$zip_sha" 34478568 application/zip
